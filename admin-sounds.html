<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sons</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --surface: #16161f;
      --surface2: #1e1e2a;
      --border: rgba(255,255,255,0.08);
      --accent: #a78bfa;
      --danger: #f87171;
      --danger-dim: rgba(248,113,113,0.12);
      --text: #e2e2e9;
      --muted: rgba(226,226,233,0.45);
      --green: #4ade80;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body { padding: 48px 24px 80px; }

    /* ── Header ── */
    .page-header {
      max-width: 720px;
      margin: 0 auto 40px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-header h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .header-links {
      display: flex;
      gap: 16px;
    }

    .header-links a {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .header-links a:hover { color: var(--text); }

    /* ── Stats ── */
    .stats-bar {
      max-width: 720px;
      margin: 0 auto 28px;
      display: flex;
      gap: 24px;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .stats-bar strong { color: var(--text); font-weight: 500; }

    /* ── Toolbar ── */
    .toolbar {
      max-width: 720px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .btn-danger {
      border-color: rgba(248,113,113,0.25);
      color: var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger-dim);
      border-color: rgba(248,113,113,0.5);
    }
    .btn-danger:disabled {
      opacity: 0.35;
      cursor: default;
      background: transparent;
    }

    /* ── Liste ── */
    #sounds-list {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sound-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, background 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .sound-card:hover { border-color: rgba(255,255,255,0.14); }
    .sound-card.deleting { opacity: 0.4; pointer-events: none; }
    .sound-card.selected { border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.04); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Checkbox */
    .sound-check {
      width: 16px;
      height: 16px;
      accent-color: var(--danger);
      cursor: pointer;
    }

    /* Corps central */
    .sound-body { min-width: 0; }

    .sound-name {
      font-size: 0.82rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .sound-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sound-meta span {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .sound-meta .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
    }

    audio {
      height: 26px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
      accent-color: var(--accent);
      display: block;
    }

    /* Actions droite */
    .sound-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-del-single {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid rgba(248,113,113,0.2);
      background: transparent;
      color: var(--danger);
      font-size: 0.72rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
    }
    .btn-del-single:hover { opacity: 1; background: var(--danger-dim); border-color: rgba(248,113,113,0.45); }

    /* ── Empty state ── */
    .empty-state {
      max-width: 720px;
      margin: 48px auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    /* ── Loader ── */
    .loader {
      max-width: 720px;
      margin: 60px auto;
      display: flex;
      justify-content: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal confirmation ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .modal h2 { font-size: 1rem; font-weight: 500; margin-bottom: 10px; }
    .modal p  { font-size: 0.82rem; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }

    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-actions .btn-cancel {
      padding: 8px 20px; border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      font-size: 0.82rem; cursor: pointer;
      transition: color 0.2s;
    }
    .modal-actions .btn-cancel:hover { color: var(--text); }
    .modal-actions .btn-confirm {
      padding: 8px 20px; border-radius: 6px;
      border: 1px solid rgba(248,113,113,0.4);
      background: var(--danger-dim); color: var(--danger);
      font-size: 0.82rem; cursor: pointer;
      transition: background 0.2s;
    }
    .modal-actions .btn-confirm:hover { background: rgba(248,113,113,0.22); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 20px;
      font-size: 0.82rem; color: var(--text);
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 300;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error   { border-color: rgba(248,113,113,0.4); color: var(--danger); }
    #toast.success { border-color: rgba(74,222,128,0.4);  color: var(--green); }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>Admin — Sons</h1>
    <div class="header-links">
      <a href="record.html">+ Enregistrer</a>
      <a href="index.html">← Site</a>
    </div>
  </div>

  <div class="stats-bar" id="stats-bar">
    <span>Chargement…</span>
  </div>

  <div class="toolbar">
    <span class="toolbar-label" id="selection-label">Tous les enregistrements</span>
    <button class="btn" id="btn-select-all">Tout sélectionner</button>
    <button class="btn btn-danger" id="btn-delete-selected" disabled>
      Supprimer la sélection
    </button>
  </div>

  <div id="sounds-list">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <!-- Modal confirmation -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Confirmer la suppression</h2>
      <p id="modal-msg">Cette action est irréversible.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">Annuler</button>
        <button class="btn-confirm" id="modal-confirm">Supprimer</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsHlm5r4cUFVy1IkRMl8yzxXn1aXsZOEg",
      authDomain: "oups-festival.firebaseapp.com",
      projectId: "oups-festival",
      storageBucket: "oups-festival.firebasestorage.app",
      messagingSenderId: "231958475030",
      appId: "1:231958475030:web:2655c7b1f7a030407ba037"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // ── État ─────────────────────────────────────────────────
    let allDocs      = [];   // { id, data }
    let selectedIds  = new Set();
    let pendingDelete = null; // fonction à exécuter si confirm

    // ── DOM ───────────────────────────────────────────────────
    const listEl       = document.getElementById('sounds-list');
    const statsEl      = document.getElementById('stats-bar');
    const labelEl      = document.getElementById('selection-label');
    const btnAll       = document.getElementById('btn-select-all');
    const btnDelSel    = document.getElementById('btn-delete-selected');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle   = document.getElementById('modal-title');
    const modalMsg     = document.getElementById('modal-msg');
    const modalCancel  = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');

    // ── Chargement ────────────────────────────────────────────
    async function loadSounds() {
      listEl.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      selectedIds.clear();
      updateToolbar();

      try {
        const q    = query(collection(db, 'sounds'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        allDocs    = snap.docs.map(d => ({ id: d.id, data: d.data() }));
        renderList();
      } catch (err) {
        listEl.innerHTML = `<div class="empty-state">Erreur : ${err.message}</div>`;
      }
    }

    // ── Rendu ─────────────────────────────────────────────────
    function renderList() {
      listEl.innerHTML = '';

      if (allDocs.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Aucun enregistrement</div>';
        updateStats(0, 0);
        return;
      }

      let totalSec = 0;
      allDocs.forEach(({ id, data: d }) => {
        totalSec += d.duration || 0;
        listEl.appendChild(buildCard(id, d));
      });

      updateStats(allDocs.length, totalSec);
    }

    function buildCard(id, d) {
      const card = document.createElement('div');
      card.className = 'sound-card';
      card.dataset.id = id;

      // Checkbox
      const chk = document.createElement('input');
      chk.type      = 'checkbox';
      chk.className = 'sound-check';
      chk.checked   = selectedIds.has(id);
      chk.addEventListener('change', () => {
        if (chk.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        card.classList.toggle('selected', chk.checked);
        updateToolbar();
      });

      // Corps
      const body    = document.createElement('div');
      body.className = 'sound-body';

      const name    = document.createElement('div');
      name.className = 'sound-name';
      name.textContent = d.filename || id;

      const meta    = document.createElement('div');
      meta.className = 'sound-meta';

      const durSpan = document.createElement('span');
      const sec = d.duration || 0;
      durSpan.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;

      const dot = document.createElement('span');
      dot.className = 'dot';

      const dateSpan = document.createElement('span');
      if (d.createdAt?.toDate) {
        dateSpan.textContent = d.createdAt.toDate().toLocaleString('fr-FR', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } else {
        dateSpan.textContent = '—';
      }

      const sizeSpan = document.createElement('span');
      if (d.audioData) {
        const kb = Math.round(d.audioData.length * 0.75 / 1024);
        sizeSpan.textContent = `${kb} KB`;
      }

      meta.appendChild(durSpan);
      meta.appendChild(dot);
      meta.appendChild(dateSpan);
      meta.appendChild(document.createTextNode(' '));
      meta.appendChild(sizeSpan);

      // Lecteur audio
      const audioEl = document.createElement('audio');
      audioEl.controls = true;
      audioEl.preload  = 'none';
      if (d.audioData) audioEl.src = d.audioData;

      body.appendChild(name);
      body.appendChild(meta);
      body.appendChild(audioEl);

      // Bouton supprimer unitaire
      const actions = document.createElement('div');
      actions.className = 'sound-actions';

      const delBtn = document.createElement('button');
      delBtn.className   = 'btn-del-single';
      delBtn.textContent = '✕ Supprimer';
      delBtn.addEventListener('click', () => {
        confirmAction(
          'Supprimer cet enregistrement ?',
          `« ${d.filename || id} » sera définitivement supprimé.`,
          async () => {
            card.classList.add('deleting');
            await deleteSounds([id]);
          }
        );
      });

      actions.appendChild(delBtn);

      card.appendChild(chk);
      card.appendChild(body);
      card.appendChild(actions);

      return card;
    }

    // ── Stats ─────────────────────────────────────────────────
    function updateStats(count, totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = String(totalSec % 60).padStart(2, '0');
      statsEl.innerHTML = `
        <span><strong>${count}</strong> enregistrement${count > 1 ? 's' : ''}</span>
        <span><strong>${m}:${s}</strong> durée totale</span>
      `;
    }

    // ── Toolbar sélection ─────────────────────────────────────
    function updateToolbar() {
      const n = selectedIds.size;
      labelEl.textContent = n > 0 ? `${n} sélectionné${n > 1 ? 's' : ''}` : 'Tous les enregistrements';
      btnDelSel.disabled  = n === 0;
      btnAll.textContent  = selectedIds.size === allDocs.length && allDocs.length > 0
        ? 'Tout désélectionner' : 'Tout sélectionner';
    }

    btnAll.addEventListener('click', () => {
      if (selectedIds.size === allDocs.length) {
        selectedIds.clear();
      } else {
        allDocs.forEach(({ id }) => selectedIds.add(id));
      }
      // Mettre à jour les checkboxes
      document.querySelectorAll('.sound-card').forEach(card => {
        const id  = card.dataset.id;
        const chk = card.querySelector('.sound-check');
        chk.checked = selectedIds.has(id);
        card.classList.toggle('selected', chk.checked);
      });
      updateToolbar();
    });

    btnDelSel.addEventListener('click', () => {
      const n = selectedIds.size;
      confirmAction(
        `Supprimer ${n} enregistrement${n > 1 ? 's' : ''} ?`,
        `Cette action est irréversible. ${n} fichier${n > 1 ? 's' : ''} sera supprimé${n > 1 ? 's' : ''}.`,
        async () => {
          await deleteSounds([...selectedIds]);
          selectedIds.clear();
          updateToolbar();
        }
      );
    });

    // ── Suppression ───────────────────────────────────────────
    async function deleteSounds(ids) {
      try {
        await Promise.all(ids.map(id => deleteDoc(doc(db, 'sounds', id))));
        allDocs = allDocs.filter(d => !ids.includes(d.id));
        ids.forEach(id => {
          document.querySelector(`.sound-card[data-id="${id}"]`)?.remove();
        });
        if (allDocs.length === 0) {
          listEl.innerHTML = '<div class="empty-state">Aucun enregistrement</div>';
        }
        // Recalcul stats
        const totalSec = allDocs.reduce((acc, { data: d }) => acc + (d.duration || 0), 0);
        updateStats(allDocs.length, totalSec);
        showToast(`${ids.length} supprimé${ids.length > 1 ? 's' : ''} ✓`, 'success');
      } catch (err) {
        showToast('Erreur : ' + err.message, 'error');
      }
    }

    // ── Modal ─────────────────────────────────────────────────
    function confirmAction(title, msg, onConfirm) {
      modalTitle.textContent = title;
      modalMsg.textContent   = msg;
      pendingDelete          = onConfirm;
      modalOverlay.classList.add('open');
    }

    modalCancel.addEventListener('click',  () => { modalOverlay.classList.remove('open'); pendingDelete = null; });
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) { modalOverlay.classList.remove('open'); pendingDelete = null; }});
    modalConfirm.addEventListener('click', async () => {
      modalOverlay.classList.remove('open');
      if (pendingDelete) { await pendingDelete(); pendingDelete = null; }
    });

    // ── Toast ─────────────────────────────────────────────────
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className   = 'show ' + (type || '');
      setTimeout(() => { t.className = type || ''; }, 3000);
    }

    // ── Init ─────────────────────────────────────────────────
    loadSounds();
  </script>
</body>
</html>
