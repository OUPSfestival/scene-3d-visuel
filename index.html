<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scène 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }



        #loading {
            position: fixed; inset: 0; z-index: 15;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: #1a1a2e; color: #ccc; font-size: 1.1rem; gap: 1.2rem;
        }
        #loading.active { display: flex; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.15); border-top-color: #7c6cf0;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Detail View ──────────────────────────────────── */
        #detail-view {
            position: fixed; inset: 0; z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #detail-view.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* Bouton retour */
        #back-btn {
            position: absolute; top: 30px; left: 30px;
            background: none; border: none; cursor: pointer; padding: 0;
            width: 64px; height: 64px;
            display: flex; align-items: center; justify-content: center;
            pointer-events: all;
        }
        #back-btn svg { transition: transform 0.2s; }
        #back-btn:hover svg { transform: translateX(-5px); }

        /* Texte bas-gauche */
        #detail-text {
            position: absolute; bottom: 50px; left: 44px;
            max-width: 440px; color: white; pointer-events: none;
        }
        #detail-title {
            font-size: 2rem; font-weight: bold; font-style: italic;
            font-family: 'Times New Roman', Times, Georgia, serif;
            margin-bottom: 0.9rem; letter-spacing: 0.01em;
        }
        #detail-desc {
            font-size: 0.85rem; line-height: 1.75;
            font-family: 'Times New Roman', Times, Georgia, serif;
            color: rgba(255,255,255,0.82);
            white-space: pre-line;
        }

        /* Panneau images droite */
        #detail-images {
            position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
            background: rgba(8, 8, 22, 0.88);
            backdrop-filter: blur(12px);
            overflow-y: auto; padding: 24px 18px;
            transform: translateX(340px);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: all;
        }
        #detail-view.visible #detail-images { transform: translateX(0); }

        /* Items figure */
        .figure-item { margin-bottom: 32px; }
        .figure-item img {
            width: 100%; display: block; object-fit: cover;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .figure-caption { padding: 10px 2px 0; }
        .figure-caption strong {
            display: block; font-size: 0.95rem; font-style: italic;
            color: white; margin-bottom: 5px;
        }
        .figure-caption p {
            font-size: 0.73rem; line-height: 1.55;
            color: rgba(255,255,255,0.65);
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            #detail-images {
                width: 100%; height: 45vh;
                top: auto; right: 0; left: 0;
                transform: translateY(100%);
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #detail-view.visible #detail-images { transform: translateY(0); }
            #detail-text { bottom: 48%; left: 20px; max-width: calc(100% - 40px); }
        }

        /* Responsive - Téléphones */

    </style>
</head>
<body>

    <!-- ImportMap pour les modules ES6 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.150.1/examples/jsm/controls/OrbitControls.js",
        "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js",
        "three/addons/loaders/RGBELoader.js": "https://unpkg.com/three@0.150.1/examples/jsm/loaders/RGBELoader.js"
      }
    }
    </script>

    <!-- Chargement -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Chargement de la scène 3D…</p>
    </div>

    <!-- Canvas pour la scène 3D -->
    <canvas id="scene3d"></canvas>

    <!-- Overlay détail : visible au clic sur une forme -->
    <div id="detail-view">
        <button id="back-btn" aria-label="Retour">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M38 16 L18 32 L38 48" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div id="detail-text">
            <h2 id="detail-title"></h2>
            <p id="detail-desc"></p>
        </div>
        <div id="detail-images">
            <div id="images-list"></div>
        </div>
    </div>

    <!-- Three.js depuis CDN -->

    <!-- Chargement du viewer Three.js en module ES -->
    <script type="module" src="./viewer.js"></script>

</body>
</html>
